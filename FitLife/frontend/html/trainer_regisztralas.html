<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--!Bootstrap-->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
    <!--?Popper: dropdowns, popovers, tooltips-->
    <script src="../bootstrap/js/popper.min.js"></script>
    <script src="../bootstrap/js/bootstrap.min.js"></script>
    <!--!CSS-->
    <link rel="stylesheet" href="../css/regisztral.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css" />
    <!--!JavaScript-->
    <script type="module" src="../js/edzo_regiszt.js"></script>
    <link rel="stylesheet" href="../fontawesome/css/all.min.css">
    <title>FitLife | Regisztráció</title>
</head>

<body>
    <div class="container">
        <div class="register-container">
            <h1>Regisztráció</h1>
            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
            <form id="trainerForm">
                <div class="mb-3">
                    <label for="fullname">Teljes név</label>
                    <input type="text" id="fullname" name="felh_nev" placeholder="Add meg a teljes neved" required>
                </div>
                <div class="mb-3">
                    <label for="email">Email cím</label>
                    <input type="email" id="email" name="email" placeholder="pl. pelda@fitlife.hu" required>
                </div>
                <div class="mb-3">
                    <label for="password">Jelszó</label>
                    <input type="password" id="password" name="password" placeholder="Válassz egy jelszót" required>
                </div>
                <div class="mb-3">
                    <label for="confirm">Jelszó megerősítése</label>
                    <input type="password" id="confirm" name="confirm" placeholder="Írd be újra a jelszót" required>
                </div>
                <div class="mb-3">
                    <label for="nem">Nem</label>
                        <select class="form-select" name="nem" id="nem">
                                <option value="férfi">férfi</option>
                                <option value="nő">nő</option>
                        </select>
                </div>
                </div>
                <div class="mb-3">
                    <label for="birthdate">Születési dátum</label>
                    <input type="date" id="birthdate" name="szul_datum" required>
                </div>
                <div class="mb-3">
                    <label for="phone">Telefonszám</label>
                    <input type="tel" id="phone" name="telszam" placeholder="+36..." required>
                </div>
                <div class="mb-3">
                    <label for="cv">Önéletrajz (PDF, DOC, DOCX)</label>
                    <input type="file" id="cv" name="cv" class="color-black" accept=".pdf,.doc,.docx" required>
                </div>
                <div class="mb-3">
                    <label for="coverLetter">Motivációs levél (PDF, DOC, DOCX)</label>
                    <input type="file" id="coverLetter" name="coverLetter" class="color-black" accept=".pdf,.doc,.docx" required>
                </div>
                <button type="submit" class="btn-fitlife">Regisztrálok</button>
            </form>

            <a href=".." class="vissza">← Vissza a főoldalra</a>
            <a href="../user_regisztral" class="vissza">Felhasználóként szerentél regisztrálni?</a>
        </div>
    </div>
</body>

</html>
