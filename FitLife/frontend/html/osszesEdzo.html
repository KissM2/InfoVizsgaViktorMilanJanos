<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../css/osszesEdzo.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/map.css">
    <script type="module" src="../js/osszesEdzo.js"></script>
    <script type="module" src="../js/osszesEdzoteremMap.js"></script>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
</head>
<body>
<div class="container-fluid main-tartalom">
        <h1 class="oldal-cim">Csapatunk</h1>
        <div class="row d-flex justify-content-center mb-3">
            <div class="col-xxl-2 col-xl-3 col-lg-4 col-md-6 col-sm-10">
                <label for="edzoNevInput" class="me-2">Keressen rá edzőre név alapján: </label> 
                <div class="d-flex flex-nowrap">
                    <input type="text" id="edzoNevInput" class="form-control bg-dark text-light" placeholder="László..."> 
                    <button type="button" id="edzoKereso" class="btn btn-sm btn-primary text-light">Keres</button>
                </div>
            </div>
        </div>
        <div class="vezerlo-sor">
            <button id="rendezes-abc-btn" class="sajat-btn">
                <span>Rendezés</span>
                <i id="rendezes-ikon" class="fa-solid fa-arrow-down-a-z"></i>
            </button>
            
            <button id="rendezes-tavolsag-btn" class="sajat-btn">Távolság</button>
            
            <button id="nezet-valto-btn" class="sajat-btn kiemelt">
                <i class="fa-solid fa-map"></i>
                <span>Térkép nézet</span>
            </button>
        </div>

        <div id="edzo-grid" class="edzo-grid-layout"></div>

        <div id="terkep-container" class="terkep-megjelenito row">
            <div id="autocomplete"></div>
            <div id="map"></div>
        </div>
    </div>
</body>
</html>
