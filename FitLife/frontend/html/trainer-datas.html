<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <title>FitLife – Edzői profil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../fontawesome/css/all.min.css">
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Saját CSS -->
    <link rel="stylesheet" href="../css/trainer-datas.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">

    <!-- Saját JS -->
    <script type="module" src="../js/trainer-datas.js"></script>
</head>

<body>

    <h1 class="text-center mb-5 text-success">Edzői Profil Kezelése</h1>
    <div class="container mt-5 pt-5">
        <!-- PROFIL ADATOK -->
        <form id="edzodatas" class="card dark-card mb-4">
            <div class="card-header">Profil adatok</div>
            <div class="row card-body">
                <div class="col-sm-12 col-lg-6">
                    <label class="label-color">Email</label>
                    <input type="email" id="email" name="email" class="form-control dark-input">
                </div>
                <div class="col-sm-12 col-lg-6">
                    <label class="label-color">Felhasználónév</label>
                    <input type="text" id="felh_nev" name="felh_nev" class="form-control dark-input">
                </div>
                <div class="col-sm-12 col-lg-6">
                    <label class="label-color">Születési dátum</label>
                    <input type="date" id="szul_datum" name="szul_datum" class="form-control dark-input">
                </div>
                <div class="col-sm-12 col-lg-6">
                    <label class="label-color">Telefonszám</label>
                    <input type="text" id="telszam" name="telszam" class="form-control dark-input">
                </div>
                <div class="col-sm-12 col-lg-6">
                    <label class="label-color">Nem</label>
                    <input type="text" id="nem" name="nem" class="form-control dark-input">
                </div>
                <div class="col-sm-12 col-lg-6 d-flex align-items-end margin-auto justify-content-center">
                    <a href="../html/jelszo_modositas.html" class="btn btn-success mt-3">Jelszó megváltoztatása</a>
                </div>
                <button id="mentes" class="btn btn-success mt-4">Mentés</button>
            </div>
        </form>
</body>

</html>
