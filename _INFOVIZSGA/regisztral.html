<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitLife | Regisztráció</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="regisztral.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="register-container">
      <h1>Regisztráció</h1>
      <form>
        <div class="mb-3">
          <label for="fullname">Teljes név</label>
          <input type="text" id="fullname" name="fullname" placeholder="Add meg a teljes neved" required>
        </div>
        <div class="mb-3">
          <label for="email">Email cím</label>
          <input type="email" id="email" name="email" placeholder="pl. pelda@fitlife.hu" required>
        </div>
        <div class="mb-3">
          <label for="password">Jelszó</label>
          <input type="password" id="password" name="password" placeholder="Válassz egy jelszót" required>
        </div>
        <div class="mb-3">
          <label for="confirm">Jelszó megerősítése</label>
          <input type="password" id="confirm" name="confirm" placeholder="Írd be újra a jelszót" required>
        </div>
        <div class="mb-3">
          <label for="birthdate">Születési dátum</label>
          <input type="date" id="birthdate" name="birthdate" required>
        </div>
        <div class="mb-3">
          <label for="phone">Telefonszám</label>
          <input type="tel" id="phone" name="phone" placeholder="+36..." required>
        </div>

        <button type="submit" class="btn-fitlife">Regisztrálok</button>
      </form>

      <a href="index.html" class="vissza">← Vissza a főoldalra</a>
    </div>
  </div>
</body>
</html>
