<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--!Bootstrap-->
  <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
  <!--?Popper: dropdowns, popovers, tooltips-->
  <script src="../bootstrap/js/popper.min.js"></script>
  <script src="../bootstrap/js/bootstrap.min.js"></script>
  <!--!CSS-->
  <link rel="stylesheet" href="../css/bejelentkez.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <!--!JavaScript-->
  <script type="module" src="../js/bejelentkezes.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <title>FitLife | Bejelentkezés</title>
</head>
<body>
  <div class="container">
    <div class="login-container">
      <h1>Bejelentkezés</h1>
      <form id="loginForm">
        <div class="mb-3">
          <label for="email">Email cím</label>
          <input type="email" id="email" name="email" placeholder="pelda@fitlife.hu" required>
        </div>
        <div class="mb-3">
          <label for="password">Jelszó</label>
          <input type="password" id="password" name="password" placeholder="Add meg a jelszavad" required>
        </div>
        <button type="submit" class="btn-fitlife">Bejelentkezem</button>
        <div class="extra-links">
          <p class="mt-3">Nincs még fiókod? <a href="../html/user_regisztralas.html">Regisztrálj itt</a></p>
          <p><a href="../html/elfelejtett_jelszo.html">Elfelejtett jelszó?</a></p>
        </div>
      </form>
      <a href="../html/index.html" class="vissza">← Vissza a főoldalra</a>
    </div>
  </div>
</body>

</html>
