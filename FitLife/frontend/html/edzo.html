<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitLife-Edző</title>
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../css/komment.css">
    <link rel="stylesheet" href="../css/edzo.css">
    <link rel="stylesheet" href="../css/map.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/naptar.css">
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/edzo.js"></script>
    <script type="module" src="../js/edzoMap.js"></script>
</head>

<body class="bg-dark text-light">
    <div id="edzo"></div>

    <div id="mapBefogo" class="mt-5">
        <div id="map"></div>
    </div>

    <div class="naptarkeret">
        <h1 class="text-success text-center">Saját foglalásaim</h1>
        <div id="naptar"></div>
        <!-- Foglalás gomb -->
        <button id="foglalasBtn">Foglalás</button>

        <!-- Modal -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">

                <div class="modal-header">
                    <h2>Időpont foglalás</h2>
                    <button id="closeBtn">✕</button>
                </div>

                <div id="modal-naptar"></div>

                <button id="saveBtn">Mentés</button>

            </div>
        </div>
    </div>

    <div class="komment-szekcio">
        <div class="komment-fejlec">
            <h3>Vélemények és Értékelések</h3>
            <button id="uj-komment-nyito-btn" class="komment-btn gomb-elsodleges">Értékelés írása</button>
        </div>

        <div id="komment-urlap-tarolo" class="komment-urlap-tarolo rejtett">
            <h4>Új értékelés</h4>
            <div class="urlap-sor">
                <textarea id="uj-komment-szoveg" rows="4"
                    placeholder="Oszd meg a tapasztalataidat az edzővel kapcsolatban..."></textarea>
            </div>
            <div class="urlap-sor ertekeles-sor">
                <label for="uj-komment-ertekeles">Értékelés (1-5):</label>
                <input type="number" id="uj-komment-ertekeles" min="1" max="5" value="5">
                <button id="komment-kuldes-btn" class="komment-btn gomb-masodlagos">Küldés</button>
            </div>
            <div id="komment-hiba-uzenet" class="hiba-uzenet"></div>
        </div>

        <div id="komment-lista" class="komment-lista">
        </div>

        <div class="tobb-komment-tarolo">
            <button id="tobb-komment-btn" class="komment-btn gomb-szellemkep rejtett">Összes megtekintése</button>
        </div>
    </div>
</body>

</html>
