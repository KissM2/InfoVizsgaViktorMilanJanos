<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
  <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
  
  <!-- Saját CSS -->
  <link rel="stylesheet" href="../fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/map.css">
  <link rel="stylesheet" href="../css/trainers-edit.css" />
  <script type="module" src="../js/trainer-edit.js"></script>
  <script type="module" src="../js/edzoteremValasztoMap.js"></script>

  <title>FitLife-Névjegy</title>
</head>

<body>

  <div class="container my-5 mt-120px">
    <div class="row align-items-center">

      <!-- BAL OLDAL -->
      <div class="col-lg-6 d-flex flex-column align-items-center text-center mb-5 mb-lg-0">

        <h5 id="" class="label-custom mb-2">Profilkép</h5>

        <img id="preview" alt="Profilkép" class="profile-img mb-3">

        <div class="card-custom w-100 p-3">
          <h5 class="title-custom mb-3">Tölts fel képet</h5>
          <input type="file" id="kepInput" class="form-control input-custom">
        </div>

      </div>

      <!-- JOBB OLDAL -->
      <form id="edzoNevjegyForm" class="col-lg-6 d-flex flex-column justify-content-center">
        <div class="card-custom mb-4">
          <h5 class="title-custom mb-3">Leírás</h5>
          <input type="text" id="leirasInput" name="leiras" class="form-control input-custom"
            placeholder="János vagyok, szeretek edzeni...">
        </div>

        <div class="card-custom mb-4">
          <h5 class="title-custom mb-3">Idézet</h5>
          <input type="text" id="idezetInput" name="idezet" class="form-control input-custom"
            placeholder='"Bátraké a szerencse"'>
        </div>

        <div class="card-custom mb-4">
          <h5 class="title-custom mb-3">Kompetenciák</h5>
          <input type="text" id="kompetenciakInput" name="kompetenciak" class="form-control input-custom"
            placeholder="Erő, kitartás, személyi edző...">
        </div>

      </form>

    </div>
    
    <div class="card-custom mb-4">
      <h3 class="title-custom mb-3">Edzőterem kiválasztása</h3>
      <div id="autocomplete"></div>
      <div class="col card-body" id="mapBefogo">
        <div id="map"></div>
      </div>
    </div>
    <button id="submit" class="btn-custom mt-2">Adatok mentése</button>
  </div>
</body>

</html>
