<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--!Bootstrap-->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
    <!--?Popper: dropdowns, popovers, tooltips-->
    <script src="../bootstrap/js/popper.min.js"></script>
    <script src="../bootstrap/js/bootstrap.min.js"></script>
    <script type="module" src="../js/user_profil.js"></script>
    <!--!CSS-->
    <link rel="stylesheet" href="../css/index.css" />
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/trainer-datas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!--!JavaScript-->
    <title>Profil</title>
</head>

<body>
    


    <h1 class="text-center text-success mt-120px">Profil Szerkeztése</h1>
    <div class="container pt-5">

        <div class="card dark-card mb-4">
            <div class="card-header">Profil adatok</div>
            <div class="card-body">
                <form id="profil_adat_form" class="row g-3">
                    <div class="col-sm-12 col-md-6">
                        <label class="label-color">Email</label>
                        <input type="email" id="email" name="email" class="form-control dark-input">
                    </div>
                    <div class="col-sm-12 col-md-6">
                        <label class="label-color">Felhasználónév</label>
                        <input type="text" id="felh_nev" name="felh_nev" class="form-control dark-input">
                    </div>
                    <div class="col-sm-12 col-md-6">
                        <label class="label-color">Születési dátum</label>
                        <input type="date" id="szul_datum" name="szul_datum" class="form-control dark-input">
                    </div>
                    <div class="col-sm-12 col-md-6">
                        <label class="label-color">Telefonszám</label>
                        <input type="text" id="telszam" name="telszam" class="form-control dark-input">
                    </div>
                    <div class="col-sm-12 col-md-6">
                        <label class="label-color">Nem</label>
                        <input type="text" id="nem" name="nem" class="form-control dark-input">
                    </div>
                    <div class="col-sm-12 col-md-6 d-flex align-items-end margin-auto justify-content-center">
                        <a href="" class="btn btn-success mt-3">Jelszó megváltoztatása</a>
                    </div>
                </form>
                <button id="mentes_profil_adat" class="btn btn-success mt-4">Mentés</button>
            </div>
        </div>
            


        <div class="card dark-card mb-4">
            <div class="card-header">Személyes adatok Szerkeztése</div>
            <div class="card-body">
                <form id="szemelyi_adat_form" class="row g-3">
                    <div class="col-sm-12 col-md-6">
                        <label class="label-color">Testsúly(kg)</label>
                        <input type="number" id="testsuly" name="testsuly" class="form-control dark-input" min="40" max="200">
                    </div>
                    <div class="col-sm-12 col-md-6">
                        <label class="label-color">Cél testsúly(kg)</label>
                        <input type="number" id="cel_testsuly" name="cel_testsuly" class="form-control dark-input" min="50" max="120">
                    </div>
                    <div class="col-sm-12 col-md-6">
                        <label class="label-color">Magasság(cm)</label>
                        <input type="number" id="magassag" name="magassag" class="form-control dark-input" min="100" max="230">
                    </div>
                    <div class="col-sm-12 col-md-6">
                        <label class="label-color">Edzésre fordított idő naponta(min)</label>
                        <input type="number" id="edzesre_forditott_ido" name="edzesre_forditott_ido" class="form-control dark-input" min="10" max="480">
                    </div>                
                    <div class="col-sm-12 col-md-6">
                        <label class="label-color">Cél alak</label>
                        <select id="cel_alak" name="cel_alak" class="form-control dark-input"></select>
                    </div>
                    <div class="col-sm-12 col-md-6">
                        <label class="label-color">Edzésen kívüli mozgás</label>
                        <select id="edzesen_kivuli_mozgas" name="edzesen_kivuli_mozgas" class="form-control dark-input"></select>
                    </div>
                </form>
                <button id="mentes_szemelyi_adat" class="btn btn-success mt-3">Mentés</button>
            </div>
        </div>
    </div>
    

</body>

</html>
