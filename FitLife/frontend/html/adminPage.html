<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--!Bootstrap-->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />

    <!--?Popper: dropdowns, popovers, tooltips-->
    <script src="../bootstrap/js/popper.min.js"></script>
    <script src="../bootstrap/js/bootstrap.min.js"></script>
    <!--!CSS-->
    <link rel="stylesheet" href="../css/adminPage.css">
    <!--!JavaScript-->
    <script src="../js/adminPage.js"></script>

    <title>Admin oldal</title>
</head>
<body>
    <div class="container-fluid py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-6 col-sm-12">
                <div class="card border-0">
                    <div class="card-body">
                        <h4 class="mb-4 text-center fw-bold">Felhasználók kezelése</h4>
                        <div class="table-responsive">
                            <table class="table table-secondary table-striped table-hover table-bordered align-middle text-center">

                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Felhasználónév</th>
                                        <th>Email</th>
                                        <th>Jelszó</th>
                                        <th>Születési dátum</th>
                                        <th>Szerep</th>
                                        <th>Műveletek</th>
                                    </tr>
                                </thead>

                                <tbody id="userTableBody">
                                    <!-- Itt jelennek meg a felhasználók -->
                                </tbody>

                            </table>
                        </div>

                    </div>
                </div>

            </div>
            <div class="col-lg-6 col-md-6 col-sm-12">
                <div class="card border-0">
                    <div class="card-body">
                        <h4 class="mb-4 text-center fw-bold">Kommentek kezelése</h4>
                        <div id="kommentek" class="row">
                            <!-- Itt jelennek meg a kommentek -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
