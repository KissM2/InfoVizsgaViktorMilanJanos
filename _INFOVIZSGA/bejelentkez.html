<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitLife | Bejelentkezés</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="bejelentkez.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="login-container">
      <h1>Bejelentkezés</h1>
      <form>
        <div class="mb-3">
          <label for="email">Email cím</label>
          <input type="email" id="email" name="email" placeholder="pelda@fitlife.hu" required>
        </div>
        <div class="mb-3">
          <label for="password">Jelszó</label>
          <input type="password" id="password" name="password" placeholder="Add meg a jelszavad" required>
        </div>
        <button type="submit" class="btn-fitlife">Bejelentkezem</button>
        <div class="extra-links">
          <p class="mt-3">Nincs még fiókod? <a href="regisztral.html">Regisztrálj itt</a></p>
          <p><a href="#">Elfelejtett jelszó?</a></p>
        </div>
      </form>
      <a href="index.html" class="vissza">← Vissza a főoldalra</a>
    </div>
  </div>
</body>

</html>
